# Home Assistant Supervisor source-build settings.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:trixie-2026.08.0
  amd64: ghcr.io/home-assistant/amd64-base-debian:trixie-2026.08.0
args:
  # The wactorz release this add-on version is built from, kept in step by
  # scripts/sync_versions.py. Set a branch, tag or sha in a local test copy.
  WACTORZ_REF: v0.7.0
labels:
  org.opencontainers.image.title: "Wactorz Home Assistant add-on"
  org.opencontainers.image.source: "https://github.com/waldiez/wactorz"
  org.opencontainers.image.licenses: "Apache-2.0"
