name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'static/docs/**'
      - 'scripts/build_docs.py'
      - 'wactorz/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -e ".[all,docs]"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build all docs
        run: python3 scripts/build_docs.py --full

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static/docs
          publish_branch: gh-pages
          force_orphan: true

      - name: Trigger waldiez docs rebuild
        env:
          DISPATCH_TOKEN: ${{ secrets.WALDIEZ_DISPATCH_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/waldiez/waldiez/dispatches \
            -d '{"event_type":"wactorz-docs-updated"}'

