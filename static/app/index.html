<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary SEO ──────────────────────────────────────────────────────── -->
    <title>Wactorz - Multi-Agent Orchestration Dashboard</title>
    <meta name="description"
          content="Wactorz: real-time multi-agent orchestration dashboard. Monitor, chat with, and control AI agents." />
    <meta name="keywords"
          content="multi-agent, AI agents, orchestration, actor model, MQTT, real-time dashboard, LLM, wactorz" />
    <meta name="author"   content="Wactorz" />
    <!-- Ops control surface (agents can be paused/stopped/reset from here) — never ask to be indexed. -->
    <meta name="robots"   content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ── Open Graph ───────────────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Wactorz" />
    <meta property="og:title"       content="Wactorz - Multi-Agent Orchestration Dashboard" />
    <meta property="og:description"
          content="Monitor and control AI agents in real-time. Built on the actor model with MQTT pub-sub." />
    <meta property="og:locale"      content="en_US" />

    <!-- ── Twitter Card ─────────────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Wactorz Dashboard" />
    <meta name="twitter:description"
          content="Monitor and control AI agents in real-time. Built on the actor model with MQTT pub-sub." />

    <!-- ── Theme / PWA ──────────────────────────────────────────────────────── -->
    <meta name="theme-color"                        content="#050818" />
    <meta name="color-scheme"                       content="dark" />
    <meta name="mobile-web-app-capable"             content="yes" />
    <meta name="apple-mobile-web-app-capable"       content="yes" />
    <meta name="apple-mobile-web-app-title"         content="Wactorz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor"            content="#050818" />
    <meta name="msapplication-tap-highlight"        content="no" />

    <!-- ── Favicon ──────────────────────────────────────────────────────────── -->
    <link rel="icon"             href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon"             href="./icon.ico" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="icon" href="./icon.png" type="image/png" sizes="512x512" />
    <!-- crossorigin: send the ingress auth cookie, else HA ingress 401s the manifest -->
    <link rel="manifest"         href="./site.webmanifest" crossorigin="use-credentials" />
    <script type="module" crossorigin src="./assets/index-C4X6uNrg.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vendor-BM98O73h.js">
    <link rel="modulepreload" crossorigin href="./assets/mqtt-B8zo0mtW.js">
    <link rel="stylesheet" crossorigin href="./assets/index-vj2OEFug.css">
  </head>
  <body>
    <!-- CSP note: inline scripts are allowed only because the monitor server stamps
         each first-party inline script with a per-request nonce at serve time (see
         monitor_server.index_handler / _csp_report_only). It also injects a nonced
         window.__WACTORZ_INGRESS_PATH bootstrap into the document head. Keep inline
         scripts first-party — never inline remote or user-supplied content here. -->
    <script>
      // Register the service worker only for the standalone / desktop deployment.
      // Behind Home Assistant's ingress proxy the app is served under a rotating
      // /api/hassio_ingress/<slug>/… path; a cache there is useless (and would risk
      // caching assets under a dead token), so we deliberately skip it. The backend
      // injects a non-empty __WACTORZ_INGRESS_PATH only when serving behind ingress.
      if ("serviceWorker" in navigator && !window.__WACTORZ_INGRESS_PATH) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").then(
            r  => console.debug("[sw] registered, scope:", r.scope),
            e  => console.warn("[sw] not registered (needs HTTPS or localhost):", e.message),
          );
        });
      }
    </script>
  </body>
</html>
