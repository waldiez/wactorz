<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary SEO ──────────────────────────────────────────────────────── -->
    <title>Wactorz - Multi-Agent Orchestration Dashboard</title>
    <meta name="description"
          content="Wactorz: real-time multi-agent orchestration dashboard. Monitor, chat with, and control AI agents." />
    <meta name="keywords"
          content="multi-agent, AI agents, orchestration, actor model, MQTT, real-time dashboard, LLM, wactorz" />
    <meta name="author"   content="Wactorz" />
    <meta name="robots"   content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ── Open Graph ───────────────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Wactorz" />
    <meta property="og:title"       content="Wactorz - Multi-Agent Orchestration Dashboard" />
    <meta property="og:description"
          content="Monitor and control AI agents in real-time. Built on the actor model with MQTT pub-sub." />
    <meta property="og:locale"      content="en_US" />

    <!-- ── Twitter Card ─────────────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Wactorz Dashboard" />
    <meta name="twitter:description"
          content="Monitor and control AI agents in real-time. Built on the actor model with MQTT pub-sub." />

    <!-- ── Theme / PWA ──────────────────────────────────────────────────────── -->
    <meta name="theme-color"                        content="#050818" />
    <meta name="color-scheme"                       content="dark" />
    <meta name="mobile-web-app-capable"             content="yes" />
    <meta name="apple-mobile-web-app-capable"       content="yes" />
    <meta name="apple-mobile-web-app-title"         content="Wactorz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor"            content="#050818" />
    <meta name="msapplication-tap-highlight"        content="no" />

    <!-- ── Favicon ──────────────────────────────────────────────────────────── -->
    <link rel="icon"             href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon"             href="./icon.ico" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="icon" href="./icon.png" type="image/png" sizes="512x512" />
    <!-- crossorigin: send the ingress auth cookie, else HA ingress 401s the manifest -->
    <link rel="manifest"         href="./site.webmanifest" crossorigin="use-credentials" />
    <script type="module" crossorigin src="./assets/index-B-8nWZfN.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vendor-Cqb5uiT0.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CryiMNBb.css">
  </head>
  <body>
    <!-- 3D canvas -->
    <canvas id="renderCanvas"></canvas>

    <!-- HUD: agent count + health badge + page links -->
    <div id="hud" class="glass" style="display:none">
      <div class="hud-title">Wactorz</div>
      <div class="hud-count" id="hud-count">0</div>
      <div class="hud-label">Active Agents</div>
      <div class="hud-badge healthy" id="hud-health">System Healthy</div>
      <div id="hud-stats"></div>
      <nav class="hud-links">
        <a id="ha-link" href="#" target="_blank" rel="noopener" class="hud-link">⌂ Home Assistant</a>
      </nav>
      <button id="btn-settings" title="App settings">⚙ Settings</button>
    </div>


    <!-- Activity feed toggle (below theme switcher) -->
    <button id="feed-toggle" style="display:none" title="Toggle activity feed">
      Feed <span id="feed-badge"></span>
    </button>

    <!-- Activity feed panel -->
    <div id="activity-feed">
      <div id="feed-list"></div>
    </div>

    <!-- Chat panel (slides in from right on agent click) -->
    <div id="chat-panel">
      <div class="af-chat-sidebar">
        <div class="af-chat-sidebar-search">
          <input id="chat-sidebar-search" placeholder="Filter agents…" autocomplete="off">
        </div>
        <div class="af-chat-agent-list" id="chat-agent-list"></div>
      </div>
      <div class="af-chat-pane">
        <div class="af-chat-pane-header">
          <button class="af-chat-back-btn" id="panel-back" title="Back to agents">‹ Back</button>
          <div class="af-chat-pane-title" id="panel-agent-name">— select an agent —</div>
          <span class="af-chat-pane-state" id="panel-agent-status"></span>
          <button class="close-btn" id="panel-close" title="Close">✕</button>
        </div>
        <div id="chat-messages"></div>
      </div>
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").then(
            r  => console.debug("[sw] registered, scope:", r.scope),
            e  => console.warn("[sw] not registered (needs HTTPS or localhost):", e.message),
          );
        });
      }
    </script>
  </body>
</html>
