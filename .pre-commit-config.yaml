repos:
  - repo: local
    hooks:
      - id: python-tests
        name: python tests
        entry: python3 -m unittest discover -s tests -p test_*.py
        language: system
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -lc 'cd frontend && bun install && bun run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/
