name: Add-on Image
# Publishes the Home Assistant add-on images, one per add-on and architecture.
# release.yml calls this once CI has passed on a release tag; by hand it builds
# an add-on-only rebuild (a run.sh fix published as 0.6.1.1, say), as a dry run
# unless told otherwise.
#
# Each image is built on the base pinned in ha-addon/bases/Dockerfile, pushed to
# GHCR by digest with no tag on it, and scanned there; only then does the version
# tag point at it. A failed scan leaves nothing tagged.
# yamllint disable rule:truthy
on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build from and publish (vX.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "Build, push by digest and scan, but attach no tags"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version_tag:
        description: "The image tag to publish: the add-on's version, e.g. 0.6.1.1"
        required: true
      ref:
        description: "The wactorz tag, branch or sha to install into the image"
        required: true
      dry_run:
        description: "Build, push by digest and scan, but attach no tags"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  addon:
    name: ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
        variant: [wactorz, wactorz-ultra]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inputs reach the script as environment variables, never as template
      # text: a value expanded into `run:` becomes part of the script.
      - name: Resolve the tag, the ref and the base
        id: meta
        env:
          CALL_TAG: ${{ inputs.tag }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_REF: ${{ inputs.ref }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -n "$CALL_TAG" ]; then
            # A release: the image carries the release's version, and installs
            # that tag rather than the branch it was cut from, so a re-run
            # rebuilds the same code.
            tag="${CALL_TAG#v}"
            ref="$CALL_TAG"
          else
            tag="$INPUT_VERSION_TAG"
            ref="$INPUT_REF"
          fi
          [ -n "$tag" ] && [ -n "$ref" ] || { echo "::error::an image tag and a wactorz ref are both required"; exit 1; }
          base=$(sed -n "s/^FROM \(.*\) AS ${VARIANT}-${ARCH}\$/\1/p" ha-addon/bases/Dockerfile)
          [ -n "$base" ] || { echo "::error::no base for ${VARIANT}-${ARCH} in ha-addon/bases/Dockerfile"; exit 1; }
          case "$ARCH" in
            aarch64) platform=linux/arm64 ;;
            amd64) platform=linux/amd64 ;;
            *) echo "::error::unknown arch $ARCH"; exit 1 ;;
          esac
          {
            echo "tag=$tag"
            echo "ref=$ref"
            echo "base=$base"
            echo "platform=$platform"
            echo "image=ghcr.io/waldiez/${VARIANT}-addon-${ARCH}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No cache in or out: a published image is built from the tree alone, and
      # the Dockerfile's upgrade step then brings the day's package updates.
      # A single image rather than an index, with no provenance or SBOM beside
      # it: that is the shape the Supervisor has always been served.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ha-addon/${{ matrix.variant }}
          platforms: ${{ steps.meta.outputs.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base }}
            WACTORZ_REF=${{ steps.meta.outputs.ref }}
            BUILD_VERSION=${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.variant == 'wactorz' && 'Wactorz' || 'Wactorz Ultra' }} Home Assistant add-on
            org.opencontainers.image.source=https://github.com/waldiez/wactorz
            # The ultra add-on carries Ultralytics, which is AGPL-3.0; see its DOCS.md.
            org.opencontainers.image.licenses=${{ matrix.variant == 'wactorz-ultra' && 'Apache-2.0 AND AGPL-3.0-only' || 'Apache-2.0' }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}

      # tempio is Home Assistant's templating binary, shipped in its base images
      # and run by their init scripts, never reached from the network. Its
      # findings are fixed only by a newer base, which Dependabot proposes, so
      # they are skipped here rather than blocking every release until then.
      - name: Scan the pushed digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ steps.meta.outputs.platform }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          make image-scan IMAGE="${IMAGE}@${DIGEST}"
          SCAN_ARGS="--image-src remote --platform ${PLATFORM} --skip-files /usr/bin/tempio"

      # `--prefer-index=false` tags the image itself rather than wrapping it in
      # an index of one, keeping the shape described above.
      - name: Tag the scanned digest
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: docker buildx imagetools create --prefer-index=false -t "${IMAGE}:${TAG}" "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
          REF: ${{ steps.meta.outputs.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "Built \`${IMAGE}@${DIGEST}\` from wactorz \`${REF}\`, and scanned it."
            if [ "$DRY_RUN" = "true" ]; then echo "Dry run: no tag attached."; else echo "Tagged \`${IMAGE}:${TAG}\`."; fi
          } >> "$GITHUB_STEP_SUMMARY"
