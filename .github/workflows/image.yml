name: Image 🐳
# Publishes the app image to Docker Hub, GHCR and Quay. release.yml calls this
# once CI has passed on a release tag and the package is on PyPI; by hand it
# runs as a dry run unless told otherwise.
#
# One build of each flavour, of both architectures, pushed to GHCR by digest
# with no tag on it. That digest is what is smoke-tested and scanned, and only
# once both pass do the release tags point at it. So the published bits are the
# tested bits, and a failed check leaves nothing tagged.
#
# The two flavours are the Dockerfile's: `default` is `wactorz:<version>` and
# `:latest`, `ultra` is `wactorz:<version>-ultra` and `:ultra`. Each is checked
# and tagged on its own, so one failing does not hold back the other.
# yamllint disable rule:truthy
on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to publish (vX.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "Build, push by digest and check it, but attach no tags"
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: true
      QUAY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish (vX.Y.Z); it must exist"
        required: true
      dry_run:
        description: "Build, push by digest and check it, but attach no tags"
        type: boolean
        default: true

permissions:
  contents: read

# One publish per tag at a time, never cancelled: two runs would race on :latest.
concurrency:
  group: image-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/waldiez/wactorz

jobs:
  publish:
    name: Build, check and publish (${{ matrix.flavour }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR
    strategy:
      fail-fast: false
      matrix:
        flavour: [default, ultra]
    steps:
      # The tag's own tree, and its history: the tag list below decides whether
      # this build may move :latest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # Inputs reach the script as environment variables, never as template
      # text: a value expanded into `run:` becomes part of the script.
      - name: Resolve the tags to publish
        id: tags
        env:
          TAG: ${{ inputs.tag }}
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$TAG is not a release tag (vX.Y.Z)"; exit 1 ;;
          esac
          # The default image has the plain names; the other says which it is.
          case "$FLAVOUR" in
            default) versioned="$TAG"; moving="latest" ;;
            *) versioned="${TAG}-${FLAVOUR}"; moving="$FLAVOUR" ;;
          esac
          tags="waldiez/wactorz:${versioned} ghcr.io/waldiez/wactorz:${versioned} quay.io/waldiez/wactorz:${versioned}"
          # Only the newest version may be :latest (or :ultra). Releasing a fix
          # on an older line would otherwise move the tag backwards for everyone
          # who pulls without naming a version.
          newest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ "$TAG" = "$newest" ]; then
            tags="$tags waldiez/wactorz:${moving} ghcr.io/waldiez/wactorz:${moving} quay.io/waldiez/wactorz:${moving}"
          else
            echo "::notice::$TAG is not the newest ($newest) - leaving :${moving} alone"
          fi
          {
            echo "list=$tags"
            echo "version=${TAG#v}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # The only build. No cache in or out: a published image is built from the
      # tree alone, never from layers another run could have written, and the
      # Dockerfile's upgrade stage then always brings the day's Debian updates.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            FLAVOUR=${{ matrix.flavour }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=Wactorz${{ matrix.flavour != 'default' && format(' ({0})', matrix.flavour) || '' }}
            org.opencontainers.image.source=https://github.com/waldiez/wactorz
            # The ultra flavour carries Ultralytics, which is AGPL-3.0; see
            # docs/dockerhub.md "Licences".
            org.opencontainers.image.licenses=${{ matrix.flavour == 'ultra' && 'Apache-2.0 AND AGPL-3.0-only' || 'Apache-2.0' }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}

      # The runner is amd64, so this runs the amd64 half; the scan below covers both.
      - name: Smoke-test the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: make image-smoke IMAGE="${IMAGE}@${DIGEST}"

      # Each architecture as the registry serves it, not a local copy of one.
      - name: Scan the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"
            make image-scan IMAGE="${IMAGE}@${DIGEST}" SCAN_ARGS="--image-src remote --platform $platform"
            echo "::endgroup::"
          done

      # Only now does any tag point at anything. The digest is an index carrying
      # the SBOM and provenance, which imagetools create copies with it.
      - name: Tag the checked digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "Built and checked \`${IMAGE}@${DIGEST}\`."
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: no tags attached."
            else
              echo "Tagged: \`${TAGS// /\`, \`}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
