# Proposes new releases of what CI and the images pin. Python dependencies are
# ranges in pyproject.toml and are not listed here until a lockfile exists.
#
# `cooldown` holds each release back for a week: a compromised release is
# usually found and pulled within days, and should not be proposed the day it
# appears. `groups` makes each ecosystem one pull request a week, not one per
# package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The app image's base, the tool images CI runs (.github/tools/Dockerfile), and
  # the add-ons' bases (ha-addon/bases/Dockerfile). A base bump there must reach
  # each add-on's build.yaml and Dockerfile default too; a test says which.
  - package-ecosystem: docker
    directories: ["/", "/.github/tools", "/ha-addon/bases"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        patterns: ["*"]
