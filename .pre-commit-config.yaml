repos:
  # Secret scanning runs before the linters: a commit that leaks a credential
  # is not made better by being well formatted, and rewriting history after the
  # fact does not unpublish it.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Gated Python lint + format (Ruff) and type checking (basedpyright). The
      # advisory Ruff families are intentionally NOT here — `make lint-py` reports
      # them; they never block a commit.
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      # The whole configured tree, not the staged files: a changed signature in
      # the package breaks the tests and scripts that call it, unstaged or not.
      - id: basedpyright
        name: basedpyright
        entry: python3 -m basedpyright
        language: system
        pass_filenames: false
        files: \.py$
      - id: python-tests
        name: python tests
        entry: python3 -m pytest tests -n auto
        language: system
        pass_filenames: false
        files: \.py$
      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -lc 'cd frontend && bun install && bun run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/
