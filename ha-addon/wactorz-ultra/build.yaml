# Home Assistant Supervisor source-build settings.
# The base line, not a dated build of it: ha-addon/bases/Dockerfile pins the
# dated build the published images use, and Dependabot moves it there alone.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:trixie
  amd64: ghcr.io/home-assistant/amd64-base-debian:trixie
args:
  # The wactorz release this add-on version is built from, kept in step by
  # scripts/sync_versions.py. Set a branch, tag or sha in a local test copy.
  WACTORZ_REF: v0.7.0
labels:
  org.opencontainers.image.title: "Wactorz Ultra Home Assistant add-on"
  org.opencontainers.image.source: "https://github.com/waldiez/wactorz"
  # Ultralytics, installed in this add-on, is AGPL-3.0: see DOCS.md.
  org.opencontainers.image.licenses: "Apache-2.0 AND AGPL-3.0-only"
