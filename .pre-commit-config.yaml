repos:
  # Secret scanning runs before the linters: a commit that leaks a credential
  # is not made better by being well formatted, and rewriting history after the
  # fact does not unpublish it.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Gated Python lint + format (Ruff) and type checking (basedpyright). The
      # advisory Ruff families are intentionally NOT here — `make lint-py` reports
      # them; they never block a commit.
      #
      # Every Python hook runs the interpreter the Makefile picks, which is
      # .venv's when there is one, so a commit made without the environment
      # activated is checked with the project's own dependencies and the locked
      # versions of the tools, as `make lint-py` and CI check it.
      - id: ruff-format
        name: ruff format
        entry: bash -c '"$(make -s python-path)" -m ruff format "$@"' --
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: bash -c '"$(make -s python-path)" -m ruff check --fix "$@"' --
        language: system
        types: [python]
      # Every file git knows about, not the staged ones: a changed signature in
      # the package breaks the tests and scripts that call it, staged or not.
      # Without the files git does not know about: see the target.
      - id: basedpyright
        name: basedpyright
        entry: make typecheck-tracked
        language: system
        pass_filenames: false
        files: \.py$
      # Without the test files git does not know about: see the target.
      - id: python-tests
        name: python tests
        entry: make test-py-tracked
        language: system
        pass_filenames: false
        files: \.py$
      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -lc 'cd frontend && bun install && bun run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/
