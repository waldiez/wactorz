name: Add-on Image
# yamllint disable rule:truthy
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "The image tag to build and push (e.g. v1.2.3 or latest)"
        required: true
        default: "latest"
      ref:
        description: "wactorz git ref to pip-install into the image (branch/tag/sha)"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  addon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag + wactorz ref
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.version_tag }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Map arch → platform + base image
        id: arch
        run: |
          case "${{ matrix.arch }}" in
            aarch64) platform=linux/arm64; base=ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20 ;;
            amd64)   platform=linux/amd64; base=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20 ;;
            *) echo "unknown arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          echo "platform=${platform}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: ./ha-addon
          platforms: ${{ steps.arch.outputs.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_FROM=${{ steps.arch.outputs.base }}
            WACTORZ_REF=${{ steps.meta.outputs.ref }}
            BUILD_VERSION=${{ steps.meta.outputs.tag }}
          tags: ghcr.io/waldiez/wactorz-addon-${{ matrix.arch }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Wactorz Home Assistant add-on
            org.opencontainers.image.source=https://github.com/waldiez/wactorz
            org.opencontainers.image.licenses=Apache-2.0
