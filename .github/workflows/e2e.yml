name: End to end

# What a person does with Wactorz, done in order against a real install: a
# broker, the application as a process, a node deployed over SSH to a container,
# and a browser. It takes minutes and needs Docker and a browser, so it runs
# nightly and on request, not on every push. See e2e/README.md.
on:
  # Nightly. GitHub runs a schedule on the default branch only.
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv
        with:
          python-version: '3.13'

      - name: Install
        run: uv sync --locked --extra all --extra dev --extra e2e

      # The browser, and the system libraries it needs on a bare runner.
      - name: Install the browser
        run: python -m playwright install --with-deps chromium

      # axe, which the journeys run on the page, comes from the frontend's
      # dependencies: the version its unit tests run.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Install axe
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Journeys
        run: make e2e

      # A run that fails keeps its directory: the server's, the broker's and the
      # node's logs, and a trace of the page that replays every step.
      - name: Upload what a failed run kept
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-run
          path: e2e/out
          if-no-files-found: ignore
