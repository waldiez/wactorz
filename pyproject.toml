[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wactorz"
dynamic = ["version"]
description = "Actor-model multi-agent framework — spawn, coordinate and monitor AI agents at runtime"
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE"
]
requires-python = ">=3.10"
authors = [{ name = "Wactorz Contributors" }]
keywords = ["agents", "llm", "actor-model", "mqtt", "multi-agent", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Core runtime — always required
dependencies = [
    "aiomqtt>=2.5.1",
    "aiohttp>=3.13.3",
    "psutil>=7.2.2",
    "prometheus-client>=0.24.0",
    "python-dotenv>=1.2.2",
    "websockets>=15.0",
    "asyncssh>=2.14.0",
    "tzdata>=2026.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.86.0"]
openai    = ["openai>=2.29.0"]
google    = ["google-genai>=1.0.0"]
discord   = ["discord.py>=2.7.1"]
telegram  = ["python-telegram-bot>=21.0"]
whatsapp  = ["twilio>=9.10.4"]
ml        = ["ultralytics>=8.0.0", "torch>=2.0.0", "numpy>=1.24.0"]
mcp       = ["mcp>=1.0.0,<2"]
# The two halves of the voice loop, named for what they do rather than for what
# they pull in. Either can be installed alone: a deployment that only listens
# has no use for a synthesiser, and one that only answers has none for a
# recogniser. `voice` is both, plus the sound device, for a machine doing all of it.
stt       = [
    "wyoming>=1.10.0",
]
tts       = [
    "edge-tts>=6.1.9",
    "wyoming>=1.10.0",
]
# Speakers and a microphone on the machine running Wactorz, for the branches
# where it answers into a room rather than into a page. PortAudio ships inside
# the wheel on Windows and macOS; on Linux it is a system package
# (libportaudio2), which is why this is not simply part of the two above.
host      = [
    "sounddevice>=0.5.0",
    "miniaudio>=1.59",
]
# Keyword spotting, for the branch that hears a room rather than a button. The
# wheel carries its own onnxruntime, so there is no separate runtime to match --
# and no musl build, which is why this is not available on the Alpine image.
wake      = [
    "sherpa-onnx>=1.13.0",
]
voice     = [
    "wactorz[stt]",
    "wactorz[tts]",
    "wactorz[host]",
    "wactorz[wake]",
]
cron      = ["croniter>=2.0.0"]
data      = ["pandas>=2.0.0"]
vision    = ["opencv-python>=4.8.0"]
docs      = [
    # Pinned exactly, not floored: both decide the bytes of the HTML committed
    # under static/docs, which CI checks against the sources. Pygments in
    # particular classifies box-drawing characters differently between minor
    # versions, so a floating floor makes the freshness check fail on every pull
    # request the day a new one is released, for a page nobody touched.
    "markdown==3.10.2",
    "pygments==2.20.0",
    "watchdog>=6.0.0",
    "pdoc>=16.0.0",
]
# Note: docs extras are only needed to *rebuild* the docs (run build_docs.py).
# The pre-built static/docs/ is committed to the repo and bundled into the wheel as-is.
dev       = [
    "wactorz[docs]",
    # Test-only support for optional catalogue-agent media paths. These stay out
    # of core and all, so Reachy Mini remains an opt-in catalogue agent.
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pre-commit>=4.5.1",
    "coverage>=7.13.5",
    "watchdog>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "ruff>=0.15.0",
    "basedpyright>=1.20.0",
    "hatchling>=1.27.0",
    "packaging>=26.3",
    "twine>=7.0.0",
]

# Everything except ML (heavy torch dep) — suitable for `pip install wactorz[all]`
all = [
    "wactorz[anthropic]",
    "wactorz[openai]",
    "wactorz[google]",
    "wactorz[discord]",
    "wactorz[telegram]",
    "wactorz[whatsapp]",
    "wactorz[mcp]",
    "wactorz[voice]",
    "wactorz[cron]",
    "wactorz[data]",
]

[project.scripts]
wactorz         = "wactorz.cli:main"
wactorz-mcp     = "wactorz.interfaces.mcp_server:main"
wactorz-reset   = "wactorz.reset:main"
wactorz-google-login = "wactorz.interfaces.google_login:main"

[project.urls]
Homepage      = "https://docs.waldiez.io/wactorz/"
Repository    = "https://github.com/waldiez/wactorz"
Documentation = "https://docs.waldiez.io/wactorz/"
"Bug Tracker" = "https://github.com/waldiez/wactorz/issues"

# ── Version ────────────────────────────────────────────────────────────────────
[tool.hatch.version]
path = "wactorz/_version.py"

# ── Build hook — auto-builds frontend if dist is stale ────────────────────────
[tool.hatch.build.hooks.custom]
path = "scripts/hooks/build_hook.py"

# ── Wheel ──────────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["wactorz", "wactorz.*"]
exclude = [
    "node_modules",
    "persist",
    "__pycache__",
    "*.log",
    ".env*",
    "frontend/src",
    "frontend/node_modules",
]

# Bundle the pre-built static assets inside the package.
# static/app/  → frontend SPA (Vite build output)
# static/docs/ → documentation site (build_docs.py output)
# After `pip install` these land at {site-packages}/wactorz/static/.
[tool.hatch.build.targets.wheel.force-include]
"static"       = "static"

# ── pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Far above the slowest test (~1.2s). This is not a performance budget — it is
# so a test that never returns is reported as itself, rather than as a run that
# hangs. pytest-randomly prints the seed on every run; pass it back with
# `-p randomly --randomly-seed=<n>` to replay an ordering that failed.
timeout = 60
# `mcp.server.fastmcp`'s own settings model declares `lifespan` with a forward
# reference it never resolves, so newer pydantic-settings warns once per run
# about a model that is not ours and a value we never set from the environment.
# Matched on the message alone: the warning class is `IncompleteFieldDefinitionWarning`,
# which only exists in the newer pydantic-settings that CI resolves — naming it
# here would fail at startup for anyone on an older one. The message is specific
# enough to stay narrow, and no model in this codebase has a `lifespan` field, so
# this cannot hide the same warning raised against something of ours.
#
# Each entry names one third-party warning we can neither fix nor act on, and is
# matched on its own message so it cannot grow into a blanket rule. A warning
# raised by our own code — including one of these shapes — is still reported.
filterwarnings = [
    "ignore:Field 'lifespan' has an incomplete definition",
    # google-genai builds a Union alias the way Python 3.14 deprecated. Emitted
    # at import, so it appears once per run on 3.14 and not at all below it.
    "ignore:'_UnionGenericAlias' is deprecated",
    # PyGObject deprecates one of its own GLib overrides while loading them, which
    # happens during the Reachy SDK's import and only where that SDK is installed.
    # It comes from inside the binding rather than from anything here, so there is
    # nothing to migrate.
    "ignore:GLib.unix_signal_add_full is deprecated",
]

# ── sdist (source distribution for PyPI) ──────────────────────────────────────
[tool.hatch.build.targets.sdist]
exclude = [
    "node_modules",
    "persist",
    "__pycache__",
    "*.log",
    ".env*",
    "frontend/node_modules",
    ".git",
]

# ── Ruff: linter + formatter ────────────────────────────────
[tool.ruff]
line-length = 100              # matches the former .flake8; the formatter owns width
target-version = "py310"       # lowest supported runtime (requires-python = ">=3.10")
extend-exclude = ["static", "frontend", "node_modules", "build", "dist", ".local"]

[tool.ruff.lint]
# Gated rules (fail pre-commit/CI) — high-signal, mostly auto-fixable:
select = [
    "E", "W",  # pycodestyle errors/warnings
    "F",       # pyflakes — undefined names, unused imports/vars (real bugs)
    "I",       # isort — import ordering (auto-fixed)
    "UP",      # pyupgrade — modernise to 3.10+ syntax (auto-fixed)
    "B",       # flake8-bugbear — likely-bug patterns (e.g. mutable arg defaults)
    "C4",      # flake8-comprehensions — simpler/faster comprehensions
    "SIM",     # flake8-simplify — redundant or convoluted logic
    "RET",     # flake8-return — return-path hygiene
    "PIE",     # flake8-pie — misc anti-patterns
    "PGH",     # pygrep-hooks — no blanket noqa / type: ignore
    "ASYNC",   # flake8-async — blocking calls inside async code (real bugs)
    "FURB",    # refurb — modernise stdlib usage
    "RUF",     # ruff-specific — mutable defaults, unused noqa, dead branches
    "D",       # pydocstyle — docstring style (google convention)
]
ignore = [
    "E501",    # line length is owned by the formatter
    "B008",    # function call in arg defaults: intentional in async handler signatures
    "B027",    # empty base-class methods are optional lifecycle hooks (on_start/on_stop)
    # docstring presence is not yet required on every public symbol
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    # docstring layout (summary line, blank-line-after, terminal punctuation) is not enforced
    "D200", "D205", "D415",
    "RUF006",  # dangling asyncio tasks are often intentional fire-and-forget
    "RUF013",  # implicit Optional: off until annotations are complete
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode: the glyphs are intentional
    "SIM105",  # contextlib.suppress not required over try/except/pass
    "SIM117",  # combined with-statements not required
    # blocking I/O and idle-loop patterns in async code, confined to rare start/stop paths
    "ASYNC110", "ASYNC230", "ASYNC240",
]
# Further families (logging, exception style, complexity, pathlib, security, datetime)
# stay advisory via `make lint-py` until each is triaged and gated.

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]       # re-exports: imported here to expose the package's public API
"tests/*" = ["B", "E402", "D"] # tests do odd things; docstrings not required in test code
# The runner carries its own `--test` reporter, whose output is the point of it.
# It also runs agent code it is sent and installs what that code imports, so
# `exec` and the pip subprocess are the feature rather than an oversight; how far
# either should be trusted is a design question, not one a lint rule settles.
"wactorz/remote_runner.py" = ["T201", "S102", "S603", "S606"]

[tool.ruff.lint.pydocstyle]
# options: google, numpy, pep257
convention = "google"          # docstring style for the advisory `D` checks (most widely used)

[tool.ruff.format]
# Black-compatible defaults; owns line width so the linter need not nag E501.

# ── basedpyright: type checking in BASIC mode (ADVISORY, not gated) ────────────
# Basic, not strict: catches real errors (undefined attrs, bad calls, None misuse)
# without demanding annotations on the ~half of functions that lack them today.
# Run via `make lint-py`; ratchet toward strict as the codebase gets typed up.
[tool.basedpyright]
include = ["wactorz"]
exclude = ["**/node_modules", "static", "frontend", "build", "dist", ".local", "**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["wactorz"]
branch = true
omit = ["wactorz/_version.py", "tests/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",               # ellipsis / stub bodies
]
# A ratchet: raise when coverage rises, never lower to pass a branch.
fail_under = 64
precision = 2

# ── pylint (advisory) ─────────────────────────────────────────────────────────
# ruff is the *gated* linter (see the Makefile); pylint is advisory and mainly
# useful for the checks ruff does not implement. The disables below are patterns
# this codebase uses deliberately — they were previously declared per-file (and,
# after the monitor split, per-line), which buried the signal in noise.
[tool.pylint.main]
ignore-paths = ["wactorz/_version.py"]
jobs = 0

[tool.pylint."messages control"]
disable = [
    # The monitor is I/O glue: a failing broadcast, purge, or file read must
    # never take the server down, so broad excepts are intentional there.
    "broad-exception-caught",
    # Actors expose internals the monitor legitimately drives (spawn registry,
    # node desired-state); these are one codebase, not a public API boundary.
    "protected-access",
    # Some function-local imports are load-order tools: they keep package-init
    # light and break cycles between `wactorz` modules, and they let an optional
    # dependency stay optional. That is the whole of it — stdlib and required
    # dependencies belong at module scope. See AGENTS.md. This blanket disable is
    # broader than that rule and hides the difference; ruff's PLC0415 can draw
    # the line properly once the existing violations are cleared.
    "import-outside-toplevel",
    # runtime.py owns process-wide state by design; rebinding needs `global`.
    "global-statement",
    # Module-level mutable state in runtime.py reads as a constant to pylint.
    "invalid-name",
    # Delegated to ruff/ruff-format, which are gated.
    "line-too-long",
    "wrong-import-order",
    "wrong-import-position",
    # aiohttp handlers must accept `request` whether or not they use it.
    "unused-argument",
    # Size heuristics: tracked via the module-split work, not per-commit.
    "too-many-lines",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "too-many-arguments",
    "too-many-positional-arguments",
    "duplicate-code",
]
