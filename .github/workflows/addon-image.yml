name: Add-on Image
# yamllint disable rule:truthy
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "The image tag to build and push (e.g. v1.2.3 or latest)"
        required: true
        default: "latest"
      ref:
        description: "wactorz git ref to pip-install into the image (branch/tag/sha)"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  addon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
        variant: [wactorz, wactorz-ultra]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag + wactorz ref
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            # The tag being released, not the branch it was cut from. `main`
            # matches it at the moment of the push and stops matching the
            # moment anything else lands, so a re-run would rebuild this same
            # image tag from different code. Add-on-only rebuilds use the
            # dispatch path below, where `ref` is chosen explicitly.
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.version_tag }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Map arch + variant → platform + base image
        id: arch
        run: |
          case "${{ matrix.arch }}" in
            aarch64) platform=linux/arm64; arch_prefix=aarch64 ;;
            amd64)   platform=linux/amd64; arch_prefix=amd64 ;;
            *) echo "unknown arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          case "${{ matrix.variant }}" in
            wactorz)       base="ghcr.io/home-assistant/${arch_prefix}-base-python:3.12-alpine3.20" ;;
            wactorz-ultra) base="ghcr.io/home-assistant/${arch_prefix}-base-debian:trixie" ;;
            *) echo "unknown variant ${{ matrix.variant }}"; exit 1 ;;
          esac
          echo "platform=${platform}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push ${{ matrix.variant }} (${{ matrix.arch }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./ha-addon/${{ matrix.variant }}
          platforms: ${{ steps.arch.outputs.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_FROM=${{ steps.arch.outputs.base }}
            WACTORZ_REF=${{ steps.meta.outputs.ref }}
            BUILD_VERSION=${{ steps.meta.outputs.tag }}
          tags: ghcr.io/waldiez/${{ matrix.variant }}-addon-${{ matrix.arch }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.variant == 'wactorz' && 'Wactorz' || 'Wactorz Ultra' }} Home Assistant add-on
            org.opencontainers.image.source=https://github.com/waldiez/wactorz
            org.opencontainers.image.licenses=Apache-2.0
