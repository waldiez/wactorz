# Mosquitto MQTT broker configuration for Wactorz
# ── Listeners ─────────────────────────────────────────────────────────────────

# Standard MQTT over TCP (agents, server)
listener 1883
protocol mqtt

# No WebSocket listener.
# Real-time updates arrive over the monitor's own WebSocket.

# ── Security ──────────────────────────────────────────────────────────────────
# The broker is the control plane, not a side channel: agent commands, chat and
# the code spawned agents run all cross it. Anonymous access here is publish
# access to every one of those, and port 1883 is published to the host.
#
# The password file is written at container start from MQTT_USERNAME and
# MQTT_PASSWORD (see the mosquitto service's command in compose.yaml) rather
# than committed. It is regenerated from the environment every start, so
# changing the credential is an env edit and a restart, with no stale file to
# find — and an existing deployment needs no manual mosquitto_passwd step.
allow_anonymous false
password_file /mosquitto/config/passwd

# ── Persistence ───────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# The compose healthcheck reconnects every 10s as client "hc", which otherwise
# emits three lines per probe and buries everything else. Not governed by
# log_type — connection messages have their own switch.
connection_messages false
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Tuning ────────────────────────────────────────────────────────────────────
# Maximum in-flight QoS 1/2 messages per client
max_inflight_messages 20

# Max packet size (bytes) — 256 KB
# It is recommended to replace `message_size_limit` with `max_packet_size`.
# message_size_limit 262144
max_packet_size 262144

# Keep-alive grace period (seconds)
# keepalive_interval 60
