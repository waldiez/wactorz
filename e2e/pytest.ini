# Configuration for the end-to-end suite only. The unit suite is configured in
# pyproject.toml; running `pytest e2e/` makes this file the rootdir config, so
# the two never share settings by accident.
[pytest]
testpaths = scenarios
python_files = test_*.py

# -p no:randomly is load-bearing, not a preference. The unit suite enables
# pytest-randomly so ordering assumptions cannot hide there; here the order is
# the point — scenarios share one backend and one state directory, and each
# builds on what the last one left. Shuffling them tests a system nobody runs.
#
# --strict-markers so a typo in `requires_node` is an error rather than a
# scenario that silently never skips and never runs.
addopts = -p no:randomly -ra --strict-markers --tb=short

# Generous, and not a performance budget: a scenario starts real processes and
# a browser. It exists so a run that wedges is reported as the scenario that
# wedged rather than as a suite that never returns.
timeout = 300

markers =
    requires_ha: needs a live Home Assistant (HA_URL / HA_TOKEN). Skips loudly, never red.
    requires_node: needs real hardware named by E2E_REAL_NODE or --real-node. Skips loudly, never red.
    requires_llm(kind): needs a provider of this kind ("real"). Skipped under the test profile.
