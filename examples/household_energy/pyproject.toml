[project]
name = "wactorz-example-household-energy"
version = "0.1.0"
description = "Wactorz example: one power meter, a classifier naming the appliance, and a person asked if it was right."
requires-python = ">=3.11"
dependencies = ["wactorz", "numpy>=1.24.0"]

# What Wactorz finds once this package is named in WACTORZ_EXTENSIONS: the two
# agents, started with the system, and the Energy tab.
[project.entry-points."wactorz.agents"]
energy-guess = "household_energy.agents:guess"
energy-runs = "household_energy.agents:EnergyRuns"

[project.entry-points."wactorz.extensions"]
energy = "household_energy.tab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["household_energy"]
