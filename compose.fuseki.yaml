# Fuseki overlay — additive, opt-in. Layer onto either base stack:
#   docker compose -f compose.yaml     -f compose.fuseki.yaml --profile full up -d
#   docker compose -f compose.dev.yaml -f compose.fuseki.yaml --profile full up -d
#
# Activate the ext/fuseki linkage by setting FUSEKI_URL in .env (both app
# services read .env), pointing at the compose service by name:
#   FUSEKI_URL=http://fuseki:3030

services:
  fuseki:
    profiles: [full]
    container_name: wactorz-fuseki
    image: wactorz-fuseki
    build:
      context: config/fuseki-container
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "${FUSEKI_EXTERNAL_PORT:-3030}:3030"
    environment:
      - ADMIN_USER=${FUSEKI_USER:-admin}
      - ADMIN_PASSWORD="${FUSEKI_PASSWORD:-${FUSEKI_ADMIN_PASSWORD:-admin}}"
      - JVM_ARGS=-Xmx2g
      - TBD=2
      - FUSEKI_CREATE_DATASETS=true
      - FUSEKI_DATASET_1=wactorz
      - FUSEKI_DATASET_2=synapse
      - FUSEKI_DATASET_3=spatial
    volumes:
      - fuseki-data:/fuseki/databases
      - ./infra/fuseki/ontology:/fuseki/ontology:ro
    networks:
      - wactorz-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/$/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # RDF bridge: subscribes to agents/+/manifest and pushes triples to Fuseki.
  # Carries its own build so it resolves under either base stack (neither tags
  # wactorz-python:latest in the dev stack).
  wactorz-fuseki:
    profiles: [full]
    container_name: wactorz-fuseki-bridge
    image: wactorz-python:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_USER: "${FUSEKI_USER:-admin}"
      FUSEKI_PASSWORD: "${FUSEKI_PASSWORD:-admin}"
    networks:
      - wactorz-net
    depends_on:
      mosquitto:
        condition: service_healthy
      fuseki:
        condition: service_healthy
    command: ["wactorz-fuseki"]

  # Let Prometheus scrape Fuseki when the overlay is active.
  prometheus:
    environment:
      PROMETHEUS_MONITOR_FUSEKI: "${PROMETHEUS_MONITOR_FUSEKI:-0}"

volumes:
  fuseki-data:
