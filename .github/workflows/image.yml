name: Image 🐳
# yamllint disable rule:truthy
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to build and push (e.g. v1.2.3 or latest)"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Full history: the tag list below decides whether this build may move
      # :latest, and a shallow clone carries no tags to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned from package.json's "packageManager": this build's output is
      # published, so it must match the assets CI verified against the tree.
      # No cache: a published image is built from the lockfile alone, never
      # from a cache another workflow run could have written.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json
          no-cache: true

      - name: Build frontend
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # Inputs reach the script as environment variables, never as template
      # text: a value expanded into `run:` becomes part of the script.
      - name: Determine version tag
        id: version
        env:
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            # Only the newest version may be :latest. Releasing a fix on an
            # older line publishes that line as current otherwise, moving the
            # tag backwards for everyone who pulls without naming a version.
            newest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ "$tag" == "$newest" ]]; then
              latest="true"
            else
              latest="false"
              echo "::notice::$tag is not the newest ($newest) - leaving :latest alone"
            fi
          else
            tag="$INPUT_VERSION_TAG"
            latest="false"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Build tag list
        id: tags
        env:
          TAG: ${{ steps.version.outputs.tag }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          TAGS="waldiez/wactorz:${TAG},ghcr.io/waldiez/wactorz:${TAG},quay.io/waldiez/wactorz:${TAG}"
          if [[ "$LATEST" == "true" ]]; then
            TAGS="${TAGS},waldiez/wactorz:latest,ghcr.io/waldiez/wactorz:latest,quay.io/waldiez/wactorz:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Debian's security updates of the day, never a cached copy (see the
          # Dockerfile's `runtime` stage).
          no-cache-filters: runtime
