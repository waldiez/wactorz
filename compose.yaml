# Wactorz — Docker Compose stack
#
# Default (docker compose up -d):
#   mosquitto only — MQTT broker on :1883
#   Then run:  wactorz
#
# Profiles:
#   python      — Python multi-agent app (REST on :8000, monitor on :8888)
#                 docker compose --profile python up -d
#   full        — Python app + Home Assistant
#                 docker compose --profile full up -d
#
# External ports (defaults, override via .env):
#   :1883  → MQTT TCP                  MQTT_EXTERNAL_PORT       (this host only; MQTT_EXTERNAL_BIND)
#   :8883  → MQTT over TLS             MQTT_TLS_EXTERNAL_PORT   (python/full)
#   :8000  → Python REST API           REST_EXTERNAL_PORT       (python/full)
#   :8888  → Python monitor Web UI     MONITOR_PORT             (python/full)
#   :9090  → Prometheus UI            (python profile)
#   :8123  → Home Assistant                                      (full)
#
# Copy .env.template → .env and fill in secrets before running.

name: wactorz

services:

  # ── MQTT broker ─────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    cap_drop: [ALL]
    # KILL is for the reload above: the broker drops to its own user, and the
    # watcher that tells it to read the new accounts runs as root, which cannot
    # signal another user's process without it.
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    container_name: wactorz-mosquitto
    restart: unless-stopped
    hostname: mosquitto
    depends_on:
      # Issues the broker's TLS certificate first. Not started under the default
      # profile, and then the broker serves plain MQTT only, as before.
      mqtt-certs:
        condition: service_completed_successfully
        required: false
    ports:
      # Plain MQTT carries the broker password in the clear, so it is published to
      # this host only. Remote nodes use TLS on 8883 below, which /deploy switches
      # them to. A node still on plain MQTT needs MQTT_EXTERNAL_BIND=0.0.0.0 in .env
      # until it is deployed again.
      - "${MQTT_EXTERNAL_BIND:-127.0.0.1}:${MQTT_EXTERNAL_PORT:-1883}:1883"
      # TLS. Answered once a certificate is in infra/mosquitto/generated: mqtt-certs
      # below puts one there under the python and full profiles, and a wactorz
      # run on this host with MQTT_TLS=1 does too (restart the broker after).
      - "${MQTT_TLS_EXTERNAL_PORT:-8883}:8883"
    volumes:
      # Read-only: the broker never writes its own config, and the image's
      # entrypoint otherwise chowns everything under /mosquitto — which travels
      # back through the bind mount and rewrites the ownership of this tracked
      # repo file. That then breaks rootless Podman, where the new owner falls
      # outside the user-namespace ID mapping.
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
      - ./infra/mosquitto/generated:/wactorz-broker:ro
    networks:
      - wactorz-net
    environment:
      # Required: the broker no longer accepts anonymous connections, and a
      # generated-per-start secret would orphan every edge node on restart.
      MQTT_USERNAME: "${MQTT_USERNAME:-wactorz}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:?set MQTT_PASSWORD in .env — the broker carries agent commands and spawned code, and no longer accepts anonymous clients}"
    # Written at start rather than committed, so there is no secret in the repo
    # and no manual mosquitto_passwd step for an existing deployment. The file
    # lives in the image, not a volume: regenerating it from the environment on
    # every start is what keeps an edited credential from being shadowed by a
    # stale one. chown because mosquitto drops to its own user and would then be
    # unable to read a root-owned 0600 file.
    #
    # The TLS listener is added the same way, at start and only when a certificate
    # is in infra/mosquitto/generated: the tracked config stays one
    # file that also serves compose.dev.yaml, and a broker with no certificate
    # starts exactly as it did.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        umask 077
        mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/config/passwd 2>/dev/null || true
        # Everything Wactorz generates is optional and independent: with none of it
        # this is the broker as it always was, on 1883 with its own account.
        take_generated() {
          # The accounts go after this broker's own, which mosquitto_passwd wrote.
          if [ -s /wactorz-broker/node_passwd ]; then
            cat /wactorz-broker/node_passwd >> /mosquitto/config/passwd
          fi
          if [ -s /wactorz-broker/acl ]; then
            cp /wactorz-broker/acl /mosquitto/config/acl
            chown mosquitto:mosquitto /mosquitto/config/acl 2>/dev/null || true
          fi
          if [ -s /wactorz-broker/broker.crt ] && [ -s /wactorz-broker/broker.key ]; then
            mkdir -p /mosquitto/config/tls
            cp /wactorz-broker/broker.crt /wactorz-broker/broker.key /mosquitto/config/tls/
            chown -R mosquitto:mosquitto /mosquitto/config/tls 2>/dev/null || true
          fi
        }
        write_conf() {
          target=$${1:-/mosquitto/config/run.conf}
          cp /mosquitto/config/mosquitto.conf "$$target"
          # Readable after the broker drops to its own user: a reload re-reads this
          # file as that user, unlike the start, which happens while it is still root.
          chmod 0644 "$$target"
          if [ -s /mosquitto/config/acl ]; then
            printf '\nacl_file /mosquitto/config/acl\n' >> "$$target"
          fi
          if [ -s /mosquitto/config/tls/broker.crt ]; then
            printf '\nlistener 8883\nprotocol mqtt\ncertfile /mosquitto/config/tls/broker.crt\nkeyfile /mosquitto/config/tls/broker.key\n' >> "$$target"
          fi
        }
        announce_conf() {
          if [ -s /mosquitto/config/acl ]; then echo "[mosquitto] node access list loaded"; fi
          if [ -s /mosquitto/config/tls/broker.crt ]; then echo "[mosquitto] TLS listener on 8883"; fi
        }
        take_generated
        write_conf
        announce_conf
        # A deploy adds an account while this broker is running, and nothing else can
        # signal it from another container: watch the folder, rebuild what it feeds
        # the broker, and ask the broker to read it again. Polling rather than inotify,
        # which does not cross every file-sharing implementation.
        (
          # Everything the broker takes from the folder, so a certificate arriving
          # on its own wakes this too -- it changes the config, not just content.
          stamp() { cat /wactorz-broker/node_passwd /wactorz-broker/acl /wactorz-broker/broker.crt /wactorz-broker/broker.key 2>/dev/null | md5sum; }
          last=$$(stamp)
          while sleep 5; do
            now=$$(stamp)
            if [ "$$now" != "$$last" ]; then
              last=$$now
              umask 077
              mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
              chown mosquitto:mosquitto /mosquitto/config/passwd 2>/dev/null || true
              take_generated
              # A reload re-reads the accounts and the access list this broker was
              # started with; it does not pick up an acl_file or a listener the
              # config did not name, which is what appears the first time a
              # certificate or an access list is generated. So: same config, reload;
              # changed config, stop, and the restart policy brings it back with it.
              write_conf /tmp/next.conf
              if cmp -s /tmp/next.conf /mosquitto/config/run.conf; then
                echo "[mosquitto] node accounts changed; reloading"
                kill -HUP 1
              else
                cp /tmp/next.conf /mosquitto/config/run.conf
                announce_conf
                echo "[mosquitto] broker configuration changed; restarting to apply it"
                kill -TERM 1
              fi
            fi
          done
        ) &
        exec /usr/sbin/mosquitto -c /mosquitto/config/run.conf
    healthcheck:
      # Authenticated, or the probe fails the moment anonymous access is off —
      # and wactorz-python waits on service_healthy, so the whole stack would
      # refuse to start.
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -t '$$SYS/#' -C 1 -i hc -W 3 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API key ────────────────────────────────────────────────────────────────────
  # One-shot. The app listens on every interface inside its container, so
  # everything on wactorz-net reaches it -- Home Assistant under the full profile
  # included -- and so does the network once a port is published. It therefore
  # always runs with a key: API_KEY from .env when set, otherwise one generated
  # here on the first run and kept in the api-key-data volume. Read it with
  #   docker compose exec wactorz-python cat /run/wactorz/api_key
  # or follow the one-time sign-in link in `docker compose logs wactorz-python`.
  # World-readable inside the volume because the app and Prometheus read it as
  # different users; nothing else mounts it.
  api-key:
    profiles: [python, full]
    build:
      context: .
      dockerfile: Dockerfile
    image: wactorz-python:latest
    container_name: wactorz-api-key
    restart: "no"
    environment:
      API_KEY: "${API_KEY:-}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -n "$$API_KEY" ]; then echo "[api-key] Using API_KEY from .env."; exit 0; fi
        if [ ! -s /run/wactorz/api_key ]; then
          python -c 'import secrets; print(secrets.token_hex(32), end="")' > /run/wactorz/api_key.tmp
          chmod 0644 /run/wactorz/api_key.tmp
          mv /run/wactorz/api_key.tmp /run/wactorz/api_key
          echo "[api-key] Generated an API key. Read it with: docker compose exec wactorz-python cat /run/wactorz/api_key"
        fi
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    network_mode: none
    volumes:
      - api-key-data:/run/wactorz

  # ── Broker TLS certificate ─────────────────────────────────────────────────────
  # One-shot. Issues the broker's certificate from a CA kept in ./state/mqtt_tls
  # -- minted on the first run, and what /deploy hands a node -- and copies the
  # certificate and key into infra/mosquitto/generated, where the broker reads them. A
  # wactorz run on this host with MQTT_TLS=1 writes the same folder, and so does
  # `make mqtt-certs`. The Wactorz image does it because the broker image has no
  # tool that can. It never fails the stack: without a certificate the broker
  # serves plain MQTT, as before.
  mqtt-certs:
    profiles: [python, full]
    build:
      context: .
      dockerfile: Dockerfile
    image: wactorz-python:latest
    container_name: wactorz-mqtt-certs
    # Fixed, because the certificate names the host it is generated on: left to
    # Docker that is the container's id, which changes on every run, and the
    # certificate would be reissued -- and the broker restarted -- each time.
    hostname: mosquitto
    restart: "no"
    env_file:
      - .env
    environment:
      # The names the certificate carries include the broker this server dials.
      MQTT_HOST: mosquitto
    # Issued as the runtime user -- docker-entrypoint.sh fixes the state directory's
    # ownership and drops privileges, as in the app -- into this container's /tmp.
    # Root then copies the certificate into the folder and hands it to the folder's
    # owner, so the checkout keeps its ownership. DAC_OVERRIDE is for that copy: the
    # folder belongs to whoever cloned the repository, not to root.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        docker-entrypoint.sh python -m wactorz.broker_certificates --export /tmp/broker-files \
          && cp -r /tmp/broker-files/. /wactorz-broker/ \
          && chown "$$(stat -c %u:%g /wactorz-broker)" /wactorz-broker/* \
          || echo "[mqtt-certs] No certificate issued; the broker serves plain MQTT only." >&2
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./state:/app/state
      - ./infra/mosquitto/generated:/wactorz-broker
    networks:
      - wactorz-net

  # ── Wactorz Python app ───────────────────────────────────────────────────────
  # docker compose --profile python up -d   (or --profile full for Python + HA)
  wactorz-python:
    profiles: [python, full]
    build:
      context: .
      dockerfile: Dockerfile
    image: wactorz-python:latest
    container_name: wactorz-python
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      # With MQTT_TLS=1 in .env the app dials the broker's TLS port instead
      # (MQTT_TLS_PORT, 8883). mqtt-certs writes the broker's copy of the
      # certificate, so the app does not: its filesystem is read-only.
      MQTT_BROKER_DIR: ""
      # Mirrors the broker's defaults above. Without this the app would take
      # MQTT_USERNAME from .env, where it may be unset while the broker
      # defaulted it — the two would disagree and every connection be refused.
      MQTT_USERNAME: "${MQTT_USERNAME:-wactorz}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:?set MQTT_PASSWORD in .env — the broker no longer accepts anonymous clients}"
      INTERFACE: "${INTERFACE:-rest}"
      # Bind every interface *inside* the container. The ports above publish to
      # the host's loopback, which is what keeps this off the network; a process
      # bound to the container's own loopback would be unreachable through them.
      WACTORZ_BIND_HOST: "0.0.0.0"
      # API_KEY from .env wins; otherwise the key the api-key service generated.
      # No WACTORZ_EXPOSED_OK: with a key always set the wide bind passes the
      # fail-closed check on its own, and if the key went missing the app would
      # refuse to start rather than serve an open API.
      API_KEY_FILE: /run/wactorz/api_key
    # The entrypoint is root only long enough to chown the state directory, then
    # drops to uid 1000. These three are the only capabilities that step needs —
    # the app itself runs with none. Dropping the rest shrinks the bounding set,
    # so nothing can be picked back up during that window or via a file
    # capability later. `cap_drop: [ALL]` on its own breaks the chown.
    cap_drop: [ALL]
    # KILL as well: `init: true` puts tini at pid 1 as root, and the app runs as
    # its own user after the entrypoint drops privileges, so without it tini
    # cannot forward a stop signal ("Operation not permitted") and the container
    # is killed after the timeout instead of shutting down.
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    # Everything the container writes goes to the state mount below, so the image
    # itself can be immutable at runtime. /tmp is a tmpfs because pip needs a
    # scratch area when an agent installs a package.
    read_only: true
    tmpfs:
      - /tmp
    init: true
    networks:
      - wactorz-net
    # Loopback-bound. Both require the API key, but they speak plain HTTP, so
    # reach them from elsewhere through a TLS proxy rather than by dropping the
    # 127.0.0.1 prefix.
    ports:
      - "127.0.0.1:${REST_EXTERNAL_PORT:-8000}:8000"              # REST API
      - "127.0.0.1:${MONITOR_PORT:-8888}:${MONITOR_PORT:-8888}"  # Web UI monitor
    volumes:
      - ./state:/app/state
      - api-key-data:/run/wactorz:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      api-key:
        condition: service_completed_successfully
    healthcheck:
      # /health, not /: every other route needs the key once API_KEY is set, and
      # a probe cannot carry one. Curling / would report unhealthy forever while
      # the process is fine, and anything acting on that restarts it in a loop.
      test: ["CMD", "curl", "-fsS", "http://localhost:${MONITOR_PORT:-8888}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    profiles: [python]
    image: prom/prometheus:v2.54.1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    container_name: wactorz-prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    environment:
      PROMETHEUS_SCRAPE_INTERVAL: "${PROMETHEUS_SCRAPE_INTERVAL:-15s}"
      PROMETHEUS_PYTHON_TARGET: "${PROMETHEUS_PYTHON_TARGET:-wactorz-python}"
      PROMETHEUS_MONITOR_MOSQUITTO: "${PROMETHEUS_MONITOR_MOSQUITTO:-0}"
      REST_EXTERNAL_PORT: "${REST_EXTERNAL_PORT:-8000}"
      # The scrape authenticates with the app's key -- from .env, or the file
      # the api-key service generated. Without it the wactorz-python target
      # answers 401 and goes quietly down.
      API_KEY: "${API_KEY:-}"
      API_KEY_FILE: /run/wactorz/api_key
    # Loopback-bound: the Prometheus UI has no auth and exposes agent names and
    # spend. Scraping happens over the internal network, not this port.
    ports:
      - "127.0.0.1:${PROMETHEUS_EXTERNAL_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./infra/prometheus/render-config.sh:/etc/prometheus/render-config.sh:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
      - api-key-data:/run/wactorz:ro
    command:
      - |
        export PROMETHEUS_TEMPLATE_FILE=/etc/prometheus/prometheus.yml.template
        sh /etc/prometheus/render-config.sh /etc/prometheus/prometheus.yml
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/etc/prometheus/console_libraries \
          --web.console.templates=/etc/prometheus/consoles
    depends_on:
      api-key:
        condition: service_completed_successfully
      wactorz-python:
        condition: service_started
      blackbox-exporter:
        condition: service_started
    networks:
      - wactorz-net
  blackbox-exporter:
    profiles: [python]
    image: prom/blackbox-exporter:v0.25.0
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    container_name: wactorz-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./infra/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - wactorz-net

  # ── Home Assistant ───────────────────────────────────────────────────────────
  # docker compose --profile full up -d
  homeassistant:
    profiles: [full]
    image: homeassistant/home-assistant:stable
    container_name: wactorz-homeassistant
    restart: unless-stopped
    # Home Assistant's own documented requirement for the container install —
    # it needs host device access for Bluetooth, USB radios (Zigbee/Z-Wave) and
    # mDNS discovery. Not a Wactorz requirement; drop it if you run HA without
    # local hardware.
    privileged: true
    networks:
      - wactorz-net
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - ./infra/homeassistant:/config
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  wactorz-net:

volumes:
  api-key-data:
  mosquitto-data:
  mosquitto-logs:
  prometheus-data:
