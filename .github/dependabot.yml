# Proposes new releases of what CI and the images pin, and of the Python
# dependencies locked in uv.lock.
#
# `cooldown` holds each release back for a week: a compromised release is
# usually found and pulled within days, and should not be proposed the day it
# appears. `groups` makes each ecosystem one pull request a week, not one per
# package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The app image's base, the tool images CI runs (.github/tools/Dockerfile), and
  # the add-ons' bases (ha-addon/bases/Dockerfile). A base bump there must reach
  # each add-on's build.yaml and Dockerfile default too; a test says which.
  - package-ecosystem: docker
    directories: ["/", "/.github/tools", "/ha-addon/bases"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]

  # The images compose.yaml and compose.dev.yaml run: the broker, pinned by
  # digest to the same release the broker tests use, and the rest by tag.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        patterns: ["*"]

  # uv.lock, and pyproject.toml where a range must widen for a new release.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Pinned exactly in the docs extra so the committed static/docs is
      # reproducible: a bump changes the generated HTML, so it is made by hand
      # together with `make docs-build`.
      - dependency-name: "markdown"
      - dependency-name: "pygments"
