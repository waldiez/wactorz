# Configuration for the end-to-end suite only. The unit suite is configured in
# pyproject.toml; running `pytest e2e/` makes this file the rootdir config, so
# the two never share settings by accident.
[pytest]
testpaths = journeys
python_files = test_*.py

# -p no:randomly: the unit suite shuffles its tests so that none depends on
# another. Here the order is the point. The journeys share one install, and each
# starts from what the one before it left, as a person's afternoon with the
# product does.
#
# -x for the same reason: after the first failure the install is no longer in
# the state the next journey starts from, and what it would report is noise.
addopts = -p no:randomly -x -ra --strict-markers --tb=short

# Not a performance budget: a journey starts real processes and a browser. It is
# here so a run that hangs is reported as the journey that hung.
timeout = 300

markers =
    real_node: needs the machine named by E2E_REAL_NODE. Skipped without it.
