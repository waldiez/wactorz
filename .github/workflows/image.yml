name: Image 🐳
# yamllint disable rule:truthy
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to build and push (e.g. v1.2.3 or latest)"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Full history: the tag list below decides whether this build may move
      # :latest, and a shallow clone carries no tags to compare against.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Pinned from package.json's "packageManager": this build's output is
      # published, so it must match the assets CI verified against the tree.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/package.json

      - name: Build frontend
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Determine version tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${{ github.ref_name }}"
            # Only the newest version may be :latest. Releasing a fix on an
            # older line publishes that line as current otherwise, moving the
            # tag backwards for everyone who pulls without naming a version.
            newest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ "$tag" == "$newest" ]]; then
              latest="true"
            else
              latest="false"
              echo "::notice::$tag is not the newest ($newest) - leaving :latest alone"
            fi
          else
            tag="${{ github.event.inputs.version_tag }}"
            latest="false"
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Build tag list
        id: tags
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TAGS="waldiez/wactorz:${TAG},ghcr.io/waldiez/wactorz:${TAG},quay.io/waldiez/wactorz:${TAG}"
          if [[ "${{ steps.version.outputs.latest }}" == "true" ]]; then
            TAGS="${TAGS},waldiez/wactorz:latest,ghcr.io/waldiez/wactorz:latest,quay.io/waldiez/wactorz:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
