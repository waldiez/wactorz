# Wactorz — development stack
#
# Runs MQTT + the Python app with hot-reload friendly settings.
#
# Usage:
#   docker compose -f compose.dev.yaml up -d
#   docker compose -f compose.dev.yaml logs -f wactorz
#   Prometheus UI will be on :9090 by default
#
# For frontend dev:
#   cd frontend && npm run dev   # Vite on :3000 with hot-reload

name: wactorz-dev

services:
  # ── MQTT broker ─────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: wactorz-dev-mosquitto
    restart: unless-stopped
    networks:
      - wactorz-net
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "hc",
          "-W",
          "3",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Wactorz Python app ───────────────────────────────────────────────────────
  wactorz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wactorz-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      INFLUX_URL: "${INFLUX_URL:-}"
      INFLUX_TOKEN: "${INFLUX_TOKEN:-}"
      INFLUX_ORG: "${INFLUX_ORG:-wactorz}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-wactorz}"
      INTERFACE: rest
    networks:
      - wactorz-net
    ports:
      - "8000:8000"
      - "8888:8888"
    volumes:
      - ./state:/app/state
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: wactorz-prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    environment:
      PROMETHEUS_SCRAPE_INTERVAL: "${PROMETHEUS_SCRAPE_INTERVAL:-15s}"
      PROMETHEUS_PYTHON_TARGET: "${PROMETHEUS_PYTHON_TARGET:-wactorz}"
      PROMETHEUS_MONITOR_MOSQUITTO: "${PROMETHEUS_MONITOR_MOSQUITTO:-0}"
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./infra/prometheus/render-config.sh:/etc/prometheus/render-config.sh:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - |
        export PROMETHEUS_TEMPLATE_FILE=/etc/prometheus/prometheus.yml.template
        sh /etc/prometheus/render-config.sh /etc/prometheus/prometheus.yml
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/etc/prometheus/console_libraries \
          --web.console.templates=/etc/prometheus/consoles
    depends_on:
      wactorz:
        condition: service_started
      blackbox-exporter:
        condition: service_started
    networks:
      - wactorz-net
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: wactorz-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./infra/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - wactorz-net

  # ── InfluxDB 2.x ─────────────────────────────────────────────────────────────
  influxdb:
    profiles: [influx]
    image: influxdb:2.7
    container_name: wactorz-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUX_EXTERNAL_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUX_ORG:-wactorz}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUX_BUCKET:-wactorz}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN:-wactorz-dev-token}"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - wactorz-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  homeassistant:
    profiles: [full]
    image: homeassistant/home-assistant:stable
    container_name: wactorz-homeassistant
    hostname: homeassistant.local
    restart: unless-stopped
    privileged: true
    networks:
      - wactorz-net
    environment:
      TZ: "${TZ:-UTC}"

    volumes:
      - ./infra/homeassistant:/config
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mosquitto-data:
  mosquitto-logs:
  influxdb-data:
  prometheus-data:

networks:
  wactorz-net:
