# =============================================================================
# Sinergym YAML: OfficeMedium Multi-Agent (Per-Zone Thermostat Control)
# =============================================================================
# Building: ASHRAE901_OfficeMedium_STD2019_Denver_MultiAgent.epJSON
# Zones:    15 occupied (3 cores + 12 perimeters), 3 plenums
# Actuators: 30 (1 heating + 1 cooling schedule per occupied zone)
# Observations: 92 total
# Action space: Box(30,)
# =============================================================================

# ---------------------------------------------------------------------------- #
#                        ID BASE FROM ENVIRONMENT NAMES                        #
# ---------------------------------------------------------------------------- #
id_base: officeMedium-multiagent

# ---------------------------------------------------------------------------- #
#                         BUILDING AND WEATHER SETTINGS                        #
# ---------------------------------------------------------------------------- #
building_file: ASHRAE901_OfficeMedium_STD2019_Denver_MultiAgent.epJSON

weather_specification:
  weather_files:
    # DEMO: pinned to the rainy Pacific-NW site so `is_raining` fires for the rain view.
    # To restore the 3-climate rotation, uncomment the AZ + NY lines and the hot/mixed keys.
    # - USA_AZ_Davis-Monthan.AFB.722745_TMY3.epw
    # - USA_NY_New.York-J.F.Kennedy.Intl.AP.744860_TMY3.epw
    - USA_WA_Port.Angeles-William.R.Fairchild.Intl.AP.727885_TMY3.epw
  keys:
    # - hot
    # - mixed
    - cool

# ---------------------------------------------------------------------------- #
#                         BUILDING EXTRA CONFIGURATION                         #
# ---------------------------------------------------------------------------- #
building_config: null

# ---------------------------------------------------------------------------- #
#                        WEATHER VARIABILITY (OPTIONAL)                        #
# ---------------------------------------------------------------------------- #
weather_variability:
  Dry Bulb Temperature:
    - 1.0
    - 0.0
    - 24.0
  Relative Humidity:
    - [2.0, 5.0]
    - 0.0
    - 24.0
    - [0, 100]

# ---------------------------------------------------------------------------- #
#                          EPISODES FOLDER GENERATION                          #
# ---------------------------------------------------------------------------- #
max_ep_store: 3

# ---------------------------------------------------------------------------- #
#                             OBSERVATION VARIABLES                            #
# ---------------------------------------------------------------------------- #

# --------------- TIME VARIABLES --------------- #
time_variables:
  - month
  - day_of_month
  - hour

# ----------------------------- OUTPUT:VARIABLES ----------------------------- #
variables:

  # --------------------------------- OUTDOOR -------------------------------- #
  Site Outdoor Air DryBulb Temperature:
    variable_names: outdoor_temperature
    keys: Environment
  Site Outdoor Air Relative Humidity:
    variable_names: outdoor_humidity
    keys: Environment
  Site Wind Speed:
    variable_names: wind_speed
    keys: Environment
  Site Wind Direction:
    variable_names: wind_direction
    keys: Environment
  Site Diffuse Solar Radiation Rate per Area:
    variable_names: diffuse_solar_radiation
    keys: Environment
  Site Direct Solar Radiation Rate per Area:
    variable_names: direct_solar_radiation
    keys: Environment

  # ---------------------- ZONE AIR TEMPERATURE (18 zones) ------------------- #
  Zone Air Temperature:
    variable_names: air_temperature
    keys:
      - Core_bottom
      - Core_mid
      - Core_top
      - Perimeter_bot_ZN_1
      - Perimeter_bot_ZN_2
      - Perimeter_bot_ZN_3
      - Perimeter_bot_ZN_4
      - Perimeter_mid_ZN_1
      - Perimeter_mid_ZN_2
      - Perimeter_mid_ZN_3
      - Perimeter_mid_ZN_4
      - Perimeter_top_ZN_1
      - Perimeter_top_ZN_2
      - Perimeter_top_ZN_3
      - Perimeter_top_ZN_4
      - FirstFloor_Plenum
      - MidFloor_Plenum
      - TopFloor_Plenum

  # ---------------------- ZONE AIR HUMIDITY (18 zones) ---------------------- #
  Zone Air Relative Humidity:
    variable_names: air_humidity
    keys:
      - Core_bottom
      - Core_mid
      - Core_top
      - Perimeter_bot_ZN_1
      - Perimeter_bot_ZN_2
      - Perimeter_bot_ZN_3
      - Perimeter_bot_ZN_4
      - Perimeter_mid_ZN_1
      - Perimeter_mid_ZN_2
      - Perimeter_mid_ZN_3
      - Perimeter_mid_ZN_4
      - Perimeter_top_ZN_1
      - Perimeter_top_ZN_2
      - Perimeter_top_ZN_3
      - Perimeter_top_ZN_4
      - FirstFloor_Plenum
      - MidFloor_Plenum
      - TopFloor_Plenum

  # --------------------- ZONE OCCUPANCY (15 occupied) ----------------------- #
  Zone People Occupant Count:
    variable_names: people_occupant
    keys:
      - Core_bottom
      - Core_mid
      - Core_top
      - Perimeter_bot_ZN_1
      - Perimeter_bot_ZN_2
      - Perimeter_bot_ZN_3
      - Perimeter_bot_ZN_4
      - Perimeter_mid_ZN_1
      - Perimeter_mid_ZN_2
      - Perimeter_mid_ZN_3
      - Perimeter_mid_ZN_4
      - Perimeter_top_ZN_1
      - Perimeter_top_ZN_2
      - Perimeter_top_ZN_3
      - Perimeter_top_ZN_4

  # ------------------- HEATING SETPOINTS (15 occupied) ---------------------- #
  Zone Thermostat Heating Setpoint Temperature:
    variable_names: htg_setpoint
    keys:
      - Core_bottom
      - Core_mid
      - Core_top
      - Perimeter_bot_ZN_1
      - Perimeter_bot_ZN_2
      - Perimeter_bot_ZN_3
      - Perimeter_bot_ZN_4
      - Perimeter_mid_ZN_1
      - Perimeter_mid_ZN_2
      - Perimeter_mid_ZN_3
      - Perimeter_mid_ZN_4
      - Perimeter_top_ZN_1
      - Perimeter_top_ZN_2
      - Perimeter_top_ZN_3
      - Perimeter_top_ZN_4

  # ------------------- COOLING SETPOINTS (15 occupied) ---------------------- #
  Zone Thermostat Cooling Setpoint Temperature:
    variable_names: clg_setpoint
    keys:
      - Core_bottom
      - Core_mid
      - Core_top
      - Perimeter_bot_ZN_1
      - Perimeter_bot_ZN_2
      - Perimeter_bot_ZN_3
      - Perimeter_bot_ZN_4
      - Perimeter_mid_ZN_1
      - Perimeter_mid_ZN_2
      - Perimeter_mid_ZN_3
      - Perimeter_mid_ZN_4
      - Perimeter_top_ZN_1
      - Perimeter_top_ZN_2
      - Perimeter_top_ZN_3
      - Perimeter_top_ZN_4

  # --------------------------------- ENERGY --------------------------------- #
  Facility Total HVAC Electricity Demand Rate:
    variable_names: HVAC_electricity_demand_rate
    keys: Whole Building

# ------------------------------- OUTPUT:METERS ------------------------------ #
meters:
  Electricity:HVAC: total_electricity_HVAC

# ---------------------------------------------------------------------------- #
#                               ACTION VARIABLES                               #
# ---------------------------------------------------------------------------- #
# 30 actuators: heating + cooling schedule per zone
actuators:
  HTGSETP_SCH_Core_bottom:
    variable_name: htg_Core_bottom
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Core_mid:
    variable_name: htg_Core_mid
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Core_top:
    variable_name: htg_Core_top
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_bot_ZN_1:
    variable_name: htg_Perimeter_bot_ZN_1
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_bot_ZN_2:
    variable_name: htg_Perimeter_bot_ZN_2
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_bot_ZN_3:
    variable_name: htg_Perimeter_bot_ZN_3
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_bot_ZN_4:
    variable_name: htg_Perimeter_bot_ZN_4
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_mid_ZN_1:
    variable_name: htg_Perimeter_mid_ZN_1
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_mid_ZN_2:
    variable_name: htg_Perimeter_mid_ZN_2
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_mid_ZN_3:
    variable_name: htg_Perimeter_mid_ZN_3
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_mid_ZN_4:
    variable_name: htg_Perimeter_mid_ZN_4
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_top_ZN_1:
    variable_name: htg_Perimeter_top_ZN_1
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_top_ZN_2:
    variable_name: htg_Perimeter_top_ZN_2
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_top_ZN_3:
    variable_name: htg_Perimeter_top_ZN_3
    element_type: Schedule:Compact
    value_type: Schedule Value
  HTGSETP_SCH_Perimeter_top_ZN_4:
    variable_name: htg_Perimeter_top_ZN_4
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Core_bottom:
    variable_name: clg_Core_bottom
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Core_mid:
    variable_name: clg_Core_mid
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Core_top:
    variable_name: clg_Core_top
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_bot_ZN_1:
    variable_name: clg_Perimeter_bot_ZN_1
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_bot_ZN_2:
    variable_name: clg_Perimeter_bot_ZN_2
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_bot_ZN_3:
    variable_name: clg_Perimeter_bot_ZN_3
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_bot_ZN_4:
    variable_name: clg_Perimeter_bot_ZN_4
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_mid_ZN_1:
    variable_name: clg_Perimeter_mid_ZN_1
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_mid_ZN_2:
    variable_name: clg_Perimeter_mid_ZN_2
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_mid_ZN_3:
    variable_name: clg_Perimeter_mid_ZN_3
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_mid_ZN_4:
    variable_name: clg_Perimeter_mid_ZN_4
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_top_ZN_1:
    variable_name: clg_Perimeter_top_ZN_1
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_top_ZN_2:
    variable_name: clg_Perimeter_top_ZN_2
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_top_ZN_3:
    variable_name: clg_Perimeter_top_ZN_3
    element_type: Schedule:Compact
    value_type: Schedule Value
  CLGSETP_SCH_Perimeter_top_ZN_4:
    variable_name: clg_Perimeter_top_ZN_4
    element_type: Schedule:Compact
    value_type: Schedule Value

# ---------------------------------------------------------------------------- #
#                   DYNAMIC CONTEXT                                            #
# ---------------------------------------------------------------------------- #
context: {}

# ---------------------------------------------------------------------------- #
#                                 ACTION SPACE                                 #
# ---------------------------------------------------------------------------- #
# 30-dim: [htg_zone_0 ... htg_zone_14, clg_zone_0 ... clg_zone_14]
action_space: gym.spaces.Box(low=np.array([12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25], dtype=np.float32), high=np.array([23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 23.25, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0], dtype=np.float32), shape=(30,), dtype=np.float32)

# ---------------------------------------------------------------------------- #
#                                REWARD FUNCTION                               #
# ---------------------------------------------------------------------------- #
reward: sinergym.utils.rewards:LinearReward

reward_kwargs:
  temperature_variables:
    - air_temperature_Core_bottom
    - air_temperature_Core_mid
    - air_temperature_Core_top
    - air_temperature_Perimeter_bot_ZN_1
    - air_temperature_Perimeter_bot_ZN_2
    - air_temperature_Perimeter_bot_ZN_3
    - air_temperature_Perimeter_bot_ZN_4
    - air_temperature_Perimeter_mid_ZN_1
    - air_temperature_Perimeter_mid_ZN_2
    - air_temperature_Perimeter_mid_ZN_3
    - air_temperature_Perimeter_mid_ZN_4
    - air_temperature_Perimeter_top_ZN_1
    - air_temperature_Perimeter_top_ZN_2
    - air_temperature_Perimeter_top_ZN_3
    - air_temperature_Perimeter_top_ZN_4
  energy_variables:
    - HVAC_electricity_demand_rate
  range_comfort_winter:
    - 20.0
    - 23.5
  range_comfort_summer:
    - 23.0
    - 26.0
  summer_start:
    - 6
    - 1
  summer_final:
    - 9
    - 30
  energy_weight: 0.5
  lambda_energy: 1.0e-4
  lambda_temperature: 1.0
